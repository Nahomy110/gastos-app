<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gastos Familiares</title>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4F46E5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 pb-20 select-none">

  <!-- Encabezado -->
  <header class="bg-indigo-600 text-white p-4 shadow-lg flex justify-between items-center sticky top-0 z-50">
    <div>
      <h1 class="text-xl font-bold">Gastos Familiares</h1>
      <p id="userInfo" class="text-xs bg-indigo-800 px-2 py-0.5 rounded-full inline-block mt-1">Sesión no iniciada</p>
    </div>
    <button id="btnLogout" onclick="logout()" class="hidden text-sm bg-red-500 hover:bg-red-600 px-3 py-1 rounded-lg">Salir</button>
  </header>

  <!-- Login -->
  <section id="authSection" class="p-6 max-w-md mx-auto mt-10 bg-white rounded-2xl shadow-md">
    <h2 class="text-2xl font-bold text-center text-indigo-600 mb-6">Iniciar Sesión</h2>
    <form onsubmit="login(event)" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Correo Electrónico</label>
        <input type="email" id="loginEmail" required class="w-full mt-1 p-3 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Contraseña</label>
        <input type="password" id="loginPassword" required class="w-full mt-1 p-3 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold shadow-lg hover:bg-indigo-700 transition">Ingresar</button>
    </form>
  </section>

  <!-- Contenido de la App -->
  <main id="appContent" class="hidden p-4 max-w-lg mx-auto space-y-6">

    <!-- Dashboard Mamá (Admin) -->
    <section id="adminDashboard" class="hidden space-y-4">
      <div class="bg-indigo-900 text-white p-5 rounded-2xl shadow">
        <h3 class="text-xs uppercase text-indigo-200">Gasto Familiar del Mes</h3>
        <p id="totalFamilyExpenses" class="text-3xl font-extrabold mt-1">$0.00</p>
      </div>

      <!-- Totales por familiar -->
      <div class="bg-white p-5 rounded-2xl shadow space-y-3">
        <h3 class="text-md font-bold text-gray-700">Gasto por Integrante</h3>
        <div id="membersExpensesList" class="space-y-2 text-sm"></div>
      </div>

      <!-- Solicitudes de préstamo pendientes -->
      <div class="bg-white p-5 rounded-2xl shadow space-y-3">
        <h3 class="text-md font-bold text-amber-600">Solicitudes de Préstamo Pendientes</h3>
        <div id="pendingLoansList" class="space-y-3"></div>
      </div>
    </section>

    <!-- Formulario para Registrar Gasto -->
    <section class="bg-white p-5 rounded-2xl shadow space-y-4">
      <h3 class="text-md font-bold text-gray-700">Registrar Nuevo Gasto</h3>
      <form onsubmit="addExpense(event)" class="space-y-3">
        <input type="number" step="0.01" id="expAmount" placeholder="Monto ($)" required class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
        <select id="expCategory" required class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
          <option value="" disabled selected>Selecciona Categoría</option>
        </select>
        <input type="text" id="expDesc" placeholder="Descripción (Ej. Pasaje, Almuerzo)" class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
        <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition">Guardar Gasto</button>
      </form>
    </section>

    <!-- Formulario Pedir Préstamo -->
    <section class="bg-white p-5 rounded-2xl shadow space-y-4">
      <h3 class="text-md font-bold text-emerald-700">Solicitar Préstamo a Mamá</h3>
      <form onsubmit="requestLoan(event)" class="space-y-3">
        <input type="number" step="0.01" id="loanAmount" placeholder="Monto Solicitado ($)" required class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
        <textarea id="loanReason" placeholder="Escribe el motivo..." required class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 h-20"></textarea>
        <button type="submit" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold hover:bg-emerald-700 transition">Enviar Solicitud</button>
      </form>
    </section>

    <!-- Mis Registros -->
    <section class="bg-white p-5 rounded-2xl shadow space-y-3">
      <h3 class="text-md font-bold text-gray-700">Mi Historial Reciente</h3>
      <div id="userActivityList" class="space-y-2 text-sm"></div>
    </section>

  </main>

  <script>
    let user = JSON.parse(localStorage.getItem('user')) || null;

    window.onload = () => {
      if (user) showApp();
    };

    async function login(e) {
      e.preventDefault();
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('loginEmail').value,
          password: document.getElementById('loginPassword').value
        })
      });
      const data = await res.json();
      if (res.ok) {
        user = data.user;
        localStorage.setItem('user', JSON.stringify(user));
        showApp();
      } else {
        alert(data.error);
      }
    }

    function logout() {
      localStorage.removeItem('user');
      location.reload();
    }

    function showApp() {
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('appContent').classList.remove('hidden');
      document.getElementById('btnLogout').classList.remove('hidden');
      document.getElementById('userInfo').innerText = `${user.nombre} (${user.rol})`;

      loadCategorias();
      loadUserActivity();

      if (user.rol === 'admin') {
        document.getElementById('adminDashboard').classList.remove('hidden');
        loadAdminDashboard();
      }
    }

    async function loadCategorias() {
      const res = await fetch('/api/categorias');
      const categorias = await res.json();
      const select = document.getElementById('expCategory');
      select.innerHTML = '<option value="" disabled selected>Selecciona Categoría</option>';
      categorias.forEach(c => {
        select.innerHTML += `<option value="${c.id_categoria}">${c.nombre}</option>`;
      });
    }

    async function addExpense(e) {
      e.preventDefault();
      await fetch('/api/gastos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          id_usuario: user.id_usuario,
          id_categoria: document.getElementById('expCategory').value,
          monto: parseFloat(document.getElementById('expAmount').value),
          descripcion: document.getElementById('expDesc').value
        })
      });
      e.target.reset();
      loadUserActivity();
      if (user.rol === 'admin') loadAdminDashboard();
    }

    async function requestLoan(e) {
      e.preventDefault();
      await fetch('/api/prestamos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          id_usuario: user.id_usuario,
          monto: parseFloat(document.getElementById('loanAmount').value),
          motivo: document.getElementById('loanReason').value
        })
      });
      e.target.reset();
      loadUserActivity();
    }

    async function loadUserActivity() {
      const res = await fetch(`/api/actividad/${user.id_usuario}`);
      const { gastos, prestamos } = await res.json();
      const container = document.getElementById('userActivityList');
      container.innerHTML = '';

      gastos.forEach(g => {
        container.innerHTML += `
          <div class="flex justify-between items-center p-2 bg-gray-50 rounded-lg">
            <div>
              <p class="font-bold text-gray-700">${g.categoria}</p>
              <p class="text-xs text-gray-400">${g.descripcion || ''}</p>
            </div>
            <span class="font-bold text-red-500">-$${parseFloat(g.monto).toFixed(2)}</span>
          </div>`;
      });

      prestamos.forEach(p => {
        let badgeColor = p.estado === 'pendiente' ? 'bg-amber-100 text-amber-700' : (p.estado === 'aprobado' ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700');
        container.innerHTML += `
          <div class="flex justify-between items-center p-2 bg-gray-50 rounded-lg">
            <div>
              <p class="font-bold text-gray-700">Préstamo: $${parseFloat(p.monto).toFixed(2)}</p>
              <p class="text-xs text-gray-400">${p.motivo}</p>
            </div>
            <span class="text-xs font-bold px-2 py-1 rounded-full ${badgeColor}">${p.estado.toUpperCase()}</span>
          </div>`;
      });
    }

    async function loadAdminDashboard() {
      const res = await fetch('/api/admin/dashboard');
      const { totalMes, porIntegrante, prestamosPendientes } = await res.json();

      document.getElementById('totalFamilyExpenses').innerText = `$${parseFloat(totalMes).toFixed(2)}`;

      const membersList = document.getElementById('membersExpensesList');
      membersList.innerHTML = '';
      porIntegrante.forEach(m => {
        membersList.innerHTML += `
          <div class="flex justify-between items-center border-b pb-1">
            <span>${m.nombre}</span>
            <span class="font-bold text-indigo-600">$${parseFloat(m.total).toFixed(2)}</span>
          </div>`;
      });

      const loansList = document.getElementById('pendingLoansList');
      loansList.innerHTML = '';
      if (prestamosPendientes.length === 0) {
        loansList.innerHTML = '<p class="text-xs text-gray-400">Sin préstamos pendientes.</p>';
      } else {
        prestamosPendientes.forEach(p => {
          loansList.innerHTML += `
            <div class="p-3 bg-amber-50 border border-amber-200 rounded-xl space-y-2">
              <div class="flex justify-between text-sm font-bold">
                <span>${p.nombre}</span>
                <span class="text-amber-700">$${parseFloat(p.monto).toFixed(2)}</span>
              </div>
              <p class="text-xs text-gray-600">${p.motivo}</p>
              <div class="flex gap-2">
                <button onclick="resolveLoan(${p.id_prestamo}, 'aprobado')" class="flex-1 bg-emerald-500 text-white py-1 rounded-lg text-xs font-bold">Aceptar</button>
                <button onclick="resolveLoan(${p.id_prestamo}, 'rechazado')" class="flex-1 bg-red-500 text-white py-1 rounded-lg text-xs font-bold">Rechazar</button>
              </div>
            </div>`;
        });
      }
    }

    async function resolveLoan(id, estado) {
      await fetch(`/api/admin/prestamos/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ estado })
      });
      loadAdminDashboard();
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
